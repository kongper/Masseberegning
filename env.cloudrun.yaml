# Non-secret runtime configuration for the Cloud Run service.
#
# This file replaces the [env] block of the deleted fly.toml, and it exists for
# the same reason: configuration that is not a credential belongs in version
# control where it can be read and reviewed, not in a deploy command or a
# dashboard where nobody can see it.
#
# Applied by deploy/api.yml with `gcloud run deploy --env-vars-file`. That flag
# REPLACES the service's environment wholesale, so this file is the complete
# set - a variable deleted from here is deleted from the service.
#
# The only secret is DATABASE_URL, which carries the database password. It is
# held in Secret Manager as `masseberegning-db-url` and mounted by
# `--set-secrets`, so it never passes through GitHub Actions.
#
# Do NOT add PORT here. Cloud Run reserves it, injects its own value, and
# rejects a deploy that tries to set it; the container's CMD already binds
# ${PORT}. HOST is likewise unnecessary - the CMD passes --host 0.0.0.0.
#
# The Supabase project ref below is not a secret: it is in the published
# config.js on the public Pages site, because the browser needs it to sign in.
# It was a Fly *secret* only out of caution, which made the API's configuration
# invisible for no security gain.

# The UI is on GitHub Pages; this process must not serve a second copy of it.
SERVE_STATIC: '0'

# Origin only - no path, no trailing slash. A GitHub Pages project site is
# served from a subpath, but the CORS origin is still the bare host.
ALLOWED_ORIGINS: 'https://kongper.github.io'

# Where invitation links point. This one DOES include the subpath, and the
# subpath is CASE-SENSITIVE: it is the repository name exactly as GitHub spells
# it. Getting the case wrong produces invitation links that 404 on GitHub's own
# "There isn't a GitHub Pages site here" page while the API and sign-in keep
# working - ALLOWED_ORIGINS is origin-only, so it is unaffected by path case.
# That combination cost an evening once.
FRONTEND_URL: 'https://kongper.github.io/Masseberegning/'

# Granted superadmin on sign-in, no invitation needed. Keep it set: it is the
# way back in if the last superadmin loses their account.
SUPERADMIN_EMAILS: 'per@prosit.no'

# Token verification. ES256 via the project's JWKS endpoint; the issuer must
# match the `iss` claim in the tokens Supabase actually mints, or every request
# fails with 401 "Ugyldig innlogging" while sign-in itself looks fine.
SUPABASE_JWKS_URL: 'https://fvkjcarxtombqnsmmfod.supabase.co/auth/v1/.well-known/jwks.json'
SUPABASE_JWT_ISSUER: 'https://fvkjcarxtombqnsmmfod.supabase.co/auth/v1'
SUPABASE_JWT_AUDIENCE: 'authenticated'

# Lower than Fly's 96 MB. On Cloud Run there is no disk: job files are written
# into memory and count against the 2 GiB, alongside a 64 MB float32 DEM and a
# 128 MB float64 difference array during a calculation.
DEM_CACHE_MB: '64'

# /tmp because that is the only path guaranteed writable on Cloud Run's
# first-generation execution environment. Matches the Dockerfile's default.
JOB_ROOT: '/tmp/mb-jobs'

# 45 minutes rather than 120, for the memory reason above. storage.cleanup()
# runs on every new job, which is what makes a shorter TTL sufficient rather
# than merely hopeful. A download link left open overnight will 404; saved
# calculations re-run on open, which is the designed answer to that.
JOB_TTL_MINUTES: '45'

MAX_AREA_M2: '10000000'        # 10 km2
CALC_PER_MINUTE: '6'
CALC_PER_DAY: '200'
INVITE_DEFAULT_DAYS: '14'
INVITE_MAX_DAYS: '90'
