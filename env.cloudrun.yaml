# NOT IN USE. The API runs on Fly.io; fly.toml holds the live configuration.
#
# This file was written for a move to Cloud Run that was never completed: the
# Cloud Run deploy workflow was never committed, no service exists in
# europe-north1, and .github/workflows/api.yml still deploys to Fly. It is kept
# because the plan is still sound and may be picked up later -
# claude/cloud-run-migration.md has the reasoning and the cutover order - but
# NOTHING READS THIS FILE TODAY.
#
# If you change an environment variable, change it in fly.toml. Changing it
# here has no effect on the running API, which is exactly the trap that made
# the previous round of confusion possible. Keep the two in step anyway, so
# this stays usable on the day it is needed.
#
# ---------------------------------------------------------------------------
#
# Non-secret runtime configuration for a Cloud Run service.
#
# Applied by a Cloud Run deploy workflow with
# `gcloud run deploy --env-vars-file`. That flag REPLACES the service's
# environment wholesale, so this file is the complete set - a variable deleted
# from here is deleted from the service.
#
# The only secret is DATABASE_URL, which carries the database password. It
# would be held in Secret Manager as `masseberegning-db-url` and mounted by
# `--set-secrets`, so it never passes through GitHub Actions.
#
# Do NOT add PORT here. Cloud Run reserves it, injects its own value, and
# rejects a deploy that tries to set it; the container's CMD already binds
# ${PORT}. HOST is likewise unnecessary - the CMD passes --host 0.0.0.0.
#
# The Supabase project ref below is not a secret: it is in the published
# config.js on the public Pages site, because the browser needs it to sign in.

# The UI is on GitHub Pages; this process must not serve a second copy of it.
SERVE_STATIC: '0'

# Origins only - scheme and host, no path, no trailing slash. Two of them
# during the move to the custom domain; drop the github.io entry once
# masseberegning.kongper.no is confirmed and no outstanding invitation points
# at the old host.
ALLOWED_ORIGINS: 'https://masseberegning.kongper.no,https://kongper.github.io'

# Where invitation links point. Root of the custom domain, not the
# /Masseberegning/ subpath a GitHub Pages project site uses. The trailing slash
# is deliberate: the invitation URL appends a query string to it.
FRONTEND_URL: 'https://masseberegning.kongper.no/'

# Granted superadmin on sign-in, no invitation needed. Keep it set: it is the
# way back in if the last superadmin loses their account.
SUPERADMIN_EMAILS: 'per@prosit.no'

# Token verification. ES256 via the project's JWKS endpoint; the issuer must
# match the `iss` claim in the tokens Supabase actually mints, or every request
# fails with 401 "Ugyldig innlogging" while sign-in itself looks fine.
SUPABASE_JWKS_URL: 'https://fvkjcarxtombqnsmmfod.supabase.co/auth/v1/.well-known/jwks.json'
SUPABASE_JWT_ISSUER: 'https://fvkjcarxtombqnsmmfod.supabase.co/auth/v1'
SUPABASE_JWT_AUDIENCE: 'authenticated'

# Lower than Fly's 96 MB. On Cloud Run there is no disk: job files are written
# into memory and count against the 2 GiB, alongside a 64 MB float32 DEM and a
# 128 MB float64 difference array during a calculation.
DEM_CACHE_MB: '64'

# /tmp because that is the only path guaranteed writable on Cloud Run's
# first-generation execution environment. Matches the Dockerfile's default.
JOB_ROOT: '/tmp/mb-jobs'

# 45 minutes rather than 120, for the memory reason above. storage.cleanup()
# runs on every new job, which is what makes a shorter TTL sufficient rather
# than merely hopeful. A download link left open overnight will 404; saved
# calculations re-run on open, which is the designed answer to that.
JOB_TTL_MINUTES: '45'

MAX_AREA_M2: '10000000'        # 10 km2
CALC_PER_MINUTE: '6'
CALC_PER_DAY: '200'
INVITE_DEFAULT_DAYS: '14'
INVITE_MAX_DAYS: '90'
