name: Publish frontend to GitHub Pages

# The UI is static. This workflow's only real job is to rewrite config.js from
# repository variables, so the API hostname and the Supabase project are not
# committed to the repo.
#
# Set these once under Settings > Secrets and variables > Actions > Variables:
#   API_BASE            https://masseberegning-api.fly.dev
#   SUPABASE_URL        https://<ref>.supabase.co
#   SUPABASE_ANON_KEY   the anon / publishable key (public by design)
#
# The anon key is a repository *variable*, not a secret: it is served to every
# visitor in config.js, so treating it as a secret would be theatre. Anything
# that must stay secret belongs on the API, never here.

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write config.js
        env:
          API_BASE: ${{ vars.API_BASE }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          for v in API_BASE SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable $v is not set. The published site would have no working sign-in."
              exit 1
            fi
          done
          cat > static/config.js <<EOF
          /* Generated by .github/workflows/pages.yml - do not edit. */
          window.MB_CONFIG = {
            apiBase: '${API_BASE%/}',
            supabaseUrl: '${SUPABASE_URL%/}',
            supabaseAnonKey: '${SUPABASE_ANON_KEY}',
            providers: ['google', 'azure'],
            allowEmailLink: true,
          };
          EOF
          echo "config.js written for ${API_BASE}"

      - name: Add .nojekyll
        # Without this, GitHub Pages runs Jekyll and silently drops any path
        # beginning with an underscore.
        run: touch static/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
