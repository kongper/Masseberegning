# fly.toml app configuration file generated for masseberegning-api on 2026-09-09T20:11:59+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'masseberegning-api'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALLOWED_ORIGINS = 'https://kongper.github.io'
  CALC_PER_DAY = '200'
  CALC_PER_MINUTE = '6'
  DEM_CACHE_MB = '96'
  FRONTEND_URL = 'https://kongper.github.io/masseberegning/'
  HOST = '0.0.0.0'
  INVITE_DEFAULT_DAYS = '14'
  INVITE_MAX_DAYS = '90'
  JOB_ROOT = '/var/lib/masseberegning/jobs'
  JOB_TTL_MINUTES = '120'
  MAX_AREA_M2 = '10000000'
  PORT = '8000'
  SERVE_STATIC = '0'
  SUPABASE_JWT_AUDIENCE = 'authenticated'
  SUPERADMIN_EMAILS = 'per@prosit.no'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
