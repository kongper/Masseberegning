# Install this at .github/workflows/pages.yml
# (setup.py moves it there; the remote file tools cannot write into .github/.)
#
name: Publish frontend to GitHub Pages

# The UI is static. This workflow's only real job is to rewrite config.js from
# repository variables, so the API hostname and the Supabase project are not
# committed to the repo.
#
# Set these once under Settings > Secrets and variables > Actions > Variables:
#   API_BASE                  the Cloud Run service URL, no trailing slash
#   SUPABASE_URL              https://<ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the "sb_publishable_..." key (public by design)
#
# On a project that still has only the legacy keys, set SUPABASE_ANON_KEY to
# the long "eyJ..." anon key instead; this workflow accepts either.
#
# The key is a repository *variable*, not a secret: it is served to every
# visitor in config.js, so treating it as a secret would be theatre. Anything
# that must stay secret belongs on the API, never here.

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write config.js
        env:
          API_BASE: ${{ vars.API_BASE }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY }}
          # Optional. PROVIDERS is a quoted JS list, e.g.  'google','azure'
          # Only list providers you have actually enabled in Supabase.
          PROVIDERS: ${{ vars.PROVIDERS }}
          ALLOW_EMAIL_LINK: ${{ vars.ALLOW_EMAIL_LINK }}
        run: |
          set -euo pipefail
          for v in API_BASE SUPABASE_URL SUPABASE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable $v is not set (SUPABASE_KEY comes from SUPABASE_PUBLISHABLE_KEY or SUPABASE_ANON_KEY). The published site would have no working sign-in."
              exit 1
            fi
          done
          # Built outside the heredoc: an unquoted heredoc does not treat \' as
          # an escape, so quoting a default inline emits a literal backslash
          # and produces invalid JavaScript.
          providers="${PROVIDERS:-}"
          [ -n "$providers" ] || providers="'google'"
          allow_email="${ALLOW_EMAIL_LINK:-false}"

          cat > static/config.js <<EOF
          /* Generated by .github/workflows/pages.yml - do not edit. */
          window.MB_CONFIG = {
            apiBase: '${API_BASE%/}',
            supabaseUrl: '${SUPABASE_URL%/}',
            supabasePublishableKey: '${SUPABASE_KEY}',
            supabaseAnonKey: '',
            providers: [${providers}],
            allowEmailLink: ${allow_email},
          };
          EOF

          node --check static/config.js && echo "config.js is valid JS"
          echo "config.js written for ${API_BASE}"

      - name: Add .nojekyll
        # Without this, GitHub Pages runs Jekyll and silently drops any path
        # beginning with an underscore.
        run: touch static/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
