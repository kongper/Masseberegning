<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Masseberegning" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="64" height="64" rx="14" fill="#0f766e"/>
  <!-- An asymmetric terrain profile - a peak with a shoulder - sitting ON the
       finished level, not floating above it. Both details are deliberate: a
       symmetric triangle with a gap under it is the eject icon. -->
  <path d="M12 43 L25 15 L38 29 L53 43 Z" fill="#fff"/>
  <!-- Ferdig planum. Extends past the landform on both sides, so it reads as
       ground level continuing rather than as a plinth. -->
  <path d="M9 43 H55" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
</svg>
